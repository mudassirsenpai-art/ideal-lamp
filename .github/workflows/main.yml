name: Setup ngrok and Remote Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-ngrok:
    runs-on: windows-latest
    timeout-minutes: 360  # GitHub Actions max limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          if (!(Test-Path -Path ngrok.zip)) { throw "Failed to download ngrok" }

      - name: Extract ngrok
        run: |
          Expand-Archive ngrok.zip -DestinationPath .
          if (!(Test-Path -Path .\ngrok.exe)) { throw "Failed to extract ngrok" }

      - name: Update ngrok
        run: .\ngrok.exe update

      - name: Authenticate with ngrok
        run: .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
          if (!(Get-LocalUser -Name "runneradmin")) { throw "Failed to create user" }

      - name: Install Gologin + desktop icon
        shell: powershell
        continue-on-error: true
        timeout-minutes: 4
        run: |
          $desk = "C:\Users\Public\Desktop"
          $url = "https://dl.gologin.com/gologin.exe"
          $out = "$env:TEMP\gologin.exe"

          $maxTries = 3
          $ok = $false
          for ($i = 1; $i -le $maxTries; $i++) {
            Write-Host "----- Download attempt $i/$maxTries -----"
            try {
              $wc = New-Object System.Net.WebClient
              Register-ObjectEvent -InputObject $wc -EventName DownloadProgressChanged -Action {
                if ($Event.SourceEventArgs.ProgressPercentage % 10 -eq 0) {
                  Write-Host ("Downloading... {0}% ({1:N1} MB / {2:N1} MB)" -f $Event.SourceEventArgs.ProgressPercentage, ($Event.SourceEventArgs.BytesReceived/1MB), ($Event.SourceEventArgs.TotalBytesToReceive/1MB))
                }
              } | Out-Null
              $task = $wc.DownloadFileTaskAsync($url, $out)
              while (-not $task.IsCompleted) { Start-Sleep -Milliseconds 500 }
              Get-EventSubscriber | Unregister-Event
              if ($task.IsFaulted) { throw $task.Exception }
            } catch {
              Write-Host "Download failed: $_"
              Start-Sleep -Seconds 3
              continue
            }

            if (!(Test-Path $out)) {
              Write-Host "File missing after download, retrying..."
              continue
            }

            $size = (Get-Item $out).Length
            Write-Host ("Downloaded size: {0:N1} MB" -f ($size/1MB))
            if ($size -lt 1MB) {
              Write-Host "File too small, likely corrupt/incomplete. Retrying..."
              Remove-Item $out -Force -ErrorAction SilentlyContinue
              continue
            }

            # Verify it's a valid PE/NSIS exe (starts with MZ header)
            $bytes = [System.IO.File]::ReadAllBytes($out)[0..1]
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Host "Invalid EXE header, file corrupt. Retrying..."
              Remove-Item $out -Force -ErrorAction SilentlyContinue
              continue
            }

            Write-Host "Download verified OK."
            $ok = $true
            break
          }

          if (-not $ok) {
            Write-Host "Gologin download failed after $maxTries attempts. Skipping install."
            exit 0
          }

          Copy-Item $out "$desk\gologin-setup.exe" -Force
          # -Wait nahi: installer app khol ke atak jata hai. 90 sec ka timeout.
          $p = Start-Process "$env:TEMP\gologin.exe" -ArgumentList '/S' -PassThru
          $p | Wait-Process -Timeout 90 -ErrorAction SilentlyContinue
          Get-Process -Name "*gologin*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter "GoLogin*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'uninst|update' } | Select-Object -First 1
          if ($exe) {
            $s = (New-Object -ComObject WScript.Shell).CreateShortcut("$desk\Gologin.lnk")
            $s.TargetPath = $exe.FullName
            $s.Save()
            Write-Host "Gologin icon bana: $($exe.FullName)"
          } else {
            Write-Host "Silent install nahi hua. RDP me Desktop se gologin-setup.exe chalao."
          }

      - name: Install Screenshot tool + desktop icons
        shell: powershell
        continue-on-error: true
        run: |
          choco install sharex -y --no-progress
          $sx = "$env:ProgramFiles\ShareX\ShareX.exe"
          if (Test-Path $sx) {
            $w = New-Object -ComObject WScript.Shell
            $full = $w.CreateShortcut("C:\Users\Public\Desktop\Screenshot Full.lnk")
            $full.TargetPath = $sx
            # -FullScreen: no on-screen overlay needed (overlay doesn't render over RDP). Saves + copies to clipboard directly.
            $full.Arguments = "-FullScreen"
            $full.Save()
            $reg = $w.CreateShortcut("C:\Users\Public\Desktop\Screenshot Select.lnk")
            $reg.TargetPath = $sx
            # RegionCapture needs an interactive overlay too - same RDP limitation. Keep as fallback only.
            $reg.Arguments = "-RegionCapture"
            $reg.Save()
            Write-Host "Screenshot icons bane (Full + Select)"
          } else {
            Write-Host "ShareX install nahi hua"
          }

      - name: Start ngrok tunnel and show RDP info
        run: |
          # Start ngrok in background
          Start-Process -NoNewWindow -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 5  # wait a bit for tunnel to initialize

          # Get public ngrok endpoint
          $retry = 0
          $tcpUrl = ""
          while ($retry -lt 10) {
            try {
              $tunnelStatus = Invoke-RestMethod http://localhost:4040/api/tunnels -ErrorAction SilentlyContinue
              if ($tunnelStatus.tunnels) {
                $tcpUrl = $tunnelStatus.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -ExpandProperty public_url
                if ($tcpUrl) { break }
              }
            } catch { }
            Start-Sleep -Seconds 2
            $retry++
          }

          if (-not $tcpUrl) {
            throw "Could not get ngrok endpoint"
          }

          $rdpAddress = $tcpUrl -replace '^tcp://',''
          Write-Host "==============================================="
          Write-Host "Ngrok RDP Address : $rdpAddress"
          Write-Host "Username          : runneradmin"
          Write-Host "Password          : P@ssw0rd!"
          Write-Host "==============================================="
          Write-Host "ARCHITECT : MUDASIR-YT"

          # Infinite loop to keep workflow alive
          Write-Host "Workflow will now stay alive to keep ngrok tunnel active..."
          while ($true) {
            Start-Sleep -Seconds 300
          }
